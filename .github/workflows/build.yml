name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['19', '21']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Install Ant if missing
        run: |
          if ! command -v ant >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ant
          fi
          ant -version

      - name: Build jar
        run: ant -noinput -buildfile build.xml clean jar

      - name: Verify jar manifest
        run: |
          unzip -p dist/Proyecto-Final.jar META-INF/MANIFEST.MF | tee manifest.txt
          grep -q '^Main-Class: proyecto.pkgfinal.ProyectoFinal' manifest.txt

      - name: Upload jar
        if: matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
          name: Proyecto-Final-jar
          path: dist/Proyecto-Final.jar
          if-no-files-found: error
